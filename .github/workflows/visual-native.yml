name: Native visual evidence

on:
  workflow_dispatch:
    inputs:
      surface_id:
        description: Canonical surface ID from docs/product/surfaces.toml
        required: false
        default: workspace.active
      state:
        description: Exact visual state label from the canonical surface catalog
        required: false
        default: home

permissions:
  contents: read

jobs:
  capture:
    name: macOS native baseline capture
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build native bundle
        run: scripts/package-macos.sh

      - name: Resolve deterministic artifact path
        env:
          REQUESTED_SURFACE: ${{ inputs.surface_id }}
          REQUESTED_STATE: ${{ inputs.state }}
        run: |
          REQUESTED_ARTIFACT="$(python3 scripts/visual_capture_path.py \
            --surface "$REQUESTED_SURFACE" \
            --state "$REQUESTED_STATE" \
            --commit "$GITHUB_SHA")"
          echo "REQUESTED_ARTIFACT=$REQUESTED_ARTIFACT" >> "$GITHUB_ENV"
          echo "resolved artifact: $REQUESTED_ARTIFACT"

      - name: Capture exact Rust window
        run: scripts/capture-macos-native.sh "$REQUESTED_ARTIFACT"

      - name: Upload native capture and launch log
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: labonair-native-visual-capture
          path: |
            artifacts/visual/**/*.png
            /tmp/labonair-rust-native-capture-open.log
          if-no-files-found: warn
