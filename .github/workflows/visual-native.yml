name: Native visual evidence

on:
  workflow_dispatch:
    inputs:
      artifact_name:
        description: Repository-relative PNG path under artifacts/visual
        required: false
        default: artifacts/visual/workspace-active--home--standard--macos--manual.png

permissions:
  contents: read

jobs:
  capture:
    name: macOS native baseline capture
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build native bundle
        run: scripts/package-macos.sh

      - name: Capture exact Rust window
        env:
          REQUESTED_ARTIFACT: ${{ inputs.artifact_name }}
        run: |
          case "$REQUESTED_ARTIFACT" in
            artifacts/visual/*.png) ;;
            *)
              echo "artifact_name must be a repository-relative artifacts/visual/*.png path" >&2
              exit 2
              ;;
          esac
          case "$REQUESTED_ARTIFACT" in
            *..*)
              echo "artifact_name must not contain parent-directory traversal" >&2
              exit 2
              ;;
          esac
          scripts/capture-macos-native.sh "$REQUESTED_ARTIFACT"

      - name: Upload native capture and launch log
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: labonair-native-visual-capture
          path: |
            artifacts/visual/**/*.png
            /tmp/labonair-rust-native-capture-open.log
          if-no-files-found: warn
