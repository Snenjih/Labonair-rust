# Automatically applied labels based on changed file paths

ci:
  - changed-files:
    - any-glob-to-any-file:
      - ".github/**"

dependencies:
  - changed-files:
    - any-glob-to-any-file:
      - "**/Cargo.toml"
      - "Cargo.lock"

ui:
  - changed-files:
    - any-glob-to-any-file:
      - "crates/ui-kit/**"
      - "crates/gpui-ext/**"
      - "crates/app/**"

theme:
  - changed-files:
    - any-glob-to-any-file:
      - "crates/theme/**"

terminal:
  - changed-files:
    - any-glob-to-any-file:
      - "crates/terminal/**"
      - "crates/terminal-integration/**"

editor:
  - changed-files:
    - any-glob-to-any-file:
      - "crates/editor/**"

ai:
  - changed-files:
    - any-glob-to-any-file:
      - "crates/ai/**"
      - "crates/mcp-core/**"
      - "crates/mcp-server/**"

ssh/sftp:
  - changed-files:
    - any-glob-to-any-file:
      - "crates/ssh/**"
      - "crates/ssh-transport/**"
      - "crates/sftp/**"
      - "crates/sftp-ssh/**"

hosts:
  - changed-files:
    - any-glob-to-any-file:
      - "crates/hosts/**"
      - "crates/hosts-ui/**"
      - "crates/credentials/**"

git:
  - changed-files:
    - any-glob-to-any-file:
      - "crates/git/**"
      - "crates/git-transport/**"
      - "crates/panel-scm/**"
      - "crates/panel-git-graph/**"

snippets:
  - changed-files:
    - any-glob-to-any-file:
      - "crates/snippets/**"
      - "crates/snippets-ssh/**"
      - "crates/panel-snippets/**"
