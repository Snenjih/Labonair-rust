# Automatically applied labels based on changed file paths

ci:
  - changed-files:
    - any-glob-to-any-file:
      - ".github/**"

dependencies:
  - changed-files:
    - any-glob-to-any-file:
      - "**/Cargo.toml"
      - "Cargo.lock"

backend:
  - changed-files:
    - any-glob-to-any-file:
      - "crates/backend/**"

ui:
  - changed-files:
    - any-glob-to-any-file:
      - "crates/ui/**"
      - "crates/app/**"

theme:
  - changed-files:
    - any-glob-to-any-file:
      - "crates/theme/**"

terminal:
  - changed-files:
    - any-glob-to-any-file:
      - "crates/terminal/**"
      - "crates/backend/src/modules/pty/**"
      - "crates/backend/src/modules/terminal_exec/**"

editor:
  - changed-files:
    - any-glob-to-any-file:
      - "crates/editor/**"

ai:
  - changed-files:
    - any-glob-to-any-file:
      - "crates/ai/**"
      - "crates/backend/src/modules/mcp/**"

ssh/sftp:
  - changed-files:
    - any-glob-to-any-file:
      - "crates/backend/src/modules/ssh/**"
      - "crates/backend/src/modules/sftp/**"

hosts:
  - changed-files:
    - any-glob-to-any-file:
      - "crates/backend/src/modules/hosts/**"
      - "crates/backend/src/modules/credentials/**"

git:
  - changed-files:
    - any-glob-to-any-file:
      - "crates/backend/src/modules/git/**"

snippets:
  - changed-files:
    - any-glob-to-any-file:
      - "crates/backend/src/modules/snippets/**"
