[package]
name = "labonair-hosts-ui"
version = "0.1.0"
edition = "2021"

[lib]
name = "labonair_hosts_ui"
path = "src/hosts_ui.rs"

[dependencies]
gpui = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
labonair-theme = { path = "../theme" }
labonair-ui-kit = { path = "../ui-kit" }
labonair-notifications = { path = "../notifications" }
labonair-backend = { path = "../backend" }
# T19-010: `apply_host_change` projects the SQLite-backed host list into
# `SettingsContent.hosts.entries` (the settings track's typed data model +
# layered store) — not a UI/workspace edge, per dependency-rule 9.
labonair-settings = { path = "../settings" }
labonair-settings-content = { path = "../settings-content" }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
