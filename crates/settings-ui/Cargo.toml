[package]
name = "labonair-settings-ui"
version = "0.1.0"
edition = "2021"

[lib]
name = "labonair_settings_ui"
path = "src/settings_ui.rs"

[dependencies]
gpui = { workspace = true }
gpui-component = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
labonair-theme = { path = "../theme" }
labonair-ui-kit = { path = "../ui-kit" }
labonair-gpui-ext = { path = "../gpui-ext" }
labonair-notifications = { path = "../notifications" }
labonair-command-palette = { path = "../command-palette" }
labonair-workspace = { path = "../workspace" }
labonair-panel = { path = "../panel" }
labonair-backend = { path = "../backend" }
labonair-ai = { path = "../ai" }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
