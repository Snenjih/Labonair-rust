[package]
name = "labonair-mcp-server"
version = "0.1.0"
edition = "2021"

[lib]
name = "labonair_mcp_server"
path = "src/mod.rs"

[dependencies]
axum = "0.8"
labonair-errors = { path = "../errors" }
labonair-events = { path = "../events" }
labonair-hosts = { path = "../hosts" }
labonair-mcp-core = { path = "../mcp-core" }
labonair-persistence = { path = "../persistence" }
labonair-secrets = { path = "../secrets" }
labonair-ssh-transport = { path = "../ssh-transport" }
log = "0.4"
rand = { version = "0.8", features = ["getrandom"] }
rmcp = { version = "2.2.0", features = ["server", "macros", "transport-streamable-http-server"] }
rusqlite = { version = "0.40", features = ["bundled"] }
schemars = "1"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4"] }
vte = "0.15"
