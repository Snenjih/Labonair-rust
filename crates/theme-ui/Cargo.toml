[package]
name = "labonair-theme-ui"
version = "0.1.0"
edition = "2021"

[lib]
name = "labonair_theme_ui"
path = "src/lib.rs"

[dependencies]
gpui = { workspace = true }
gpui-component = { workspace = true }
serde_json = { workspace = true }
labonair-theme = { path = "../theme" }
labonair-settings = { path = "../settings" }
labonair-command-palette-core = { path = "../command-palette-core" }
labonair-command-palette-runtime = { path = "../command-palette-runtime" }
labonair-ui-kit = { path = "../ui-kit" }
tracing = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSResponder",
    "NSView",
    "NSWindow",
] }
raw-window-handle = "0.6"

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
uuid = { workspace = true }
