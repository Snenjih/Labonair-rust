[package]
name = "labonair-theme-ui"
version = "0.1.0"
edition = "2021"

[lib]
name = "labonair_theme_ui"
path = "src/lib.rs"

[dependencies]
gpui = { workspace = true }
serde_json = { workspace = true }
labonair-theme = { path = "../theme" }
labonair-settings = { path = "../settings" }
labonair-command-palette-core = { path = "../command-palette-core" }
labonair-command-palette-runtime = { path = "../command-palette-runtime" }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
uuid = { workspace = true }
