[package]
name = "labonair-panel-ai"
version = "0.1.0"
edition = "2021"

[lib]
name = "labonair_panel_ai"
path = "src/panel_ai.rs"

[dependencies]
gpui = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
labonair-theme = { path = "../theme" }
labonair-ui-kit = { path = "../ui-kit" }
labonair-command-palette = { path = "../command-palette" }
labonair-backend = { path = "../backend" }
labonair-editor = { path = "../editor" }
labonair-ai = { path = "../ai" }
labonair-workspace = { path = "../workspace" }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
