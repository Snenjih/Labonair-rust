[package]
name = "labonair"
version = "1.0.0"
edition = "2021"

[[bin]]
name = "labonair"
path = "src/main.rs"

[dependencies]
gpui = { workspace = true }
gpui-component = { workspace = true }
labonair-shell = { path = "../shell" }
labonair-terminal = { path = "../terminal" }
labonair-editor = { path = "../editor" }
labonair-backend = { path = "../backend" }
labonair-ai = { path = "../ai" }
labonair-theme = { path = "../theme" }
