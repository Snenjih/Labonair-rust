[package]
name = "labonair-panel-snippets"
version = "0.1.0"
edition = "2021"

[lib]
name = "labonair_panel_snippets"
path = "src/panel_snippets.rs"

[dependencies]
gpui = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
labonair-theme = { path = "../theme" }
labonair-ui-kit = { path = "../ui-kit" }
labonair-panel = { path = "../panel" }
labonair-notifications = { path = "../notifications" }
labonair-backend = { path = "../backend" }
labonair-workspace = { path = "../workspace" }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
