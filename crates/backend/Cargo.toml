[package]
name = "labonair-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
labonair-events = { path = "../events" }
labonair-snippets = { path = "../snippets" }
labonair-ssh-transport = { path = "../ssh-transport" }
labonair-transfers = { path = "../transfers" }

# SSH / SFTP — versions taken 1:1 from reference-src/src-tauri/Cargo.toml
russh = { version = "0.62.2", default-features = false, features = ["ring", "flate2", "rsa"] }
# Git runs via the `git` CLI (std::process / tokio::process) — no git2/libgit2.

# Async
tokio = { version = "1", features = ["full"] }

# Serialization
serde_json = "1"

uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
