[package]
name = "labonair-keymap"
version = "0.1.0"
edition = "2021"

[lib]
name = "labonair_keymap"
path = "src/lib.rs"

[dependencies]
labonair-interaction-contracts = { path = "../interaction-contracts" }
labonair-command-palette-core = { path = "../command-palette-core" }
serde_json = { workspace = true }
jsonc-parser = { version = "0.23", features = ["serde"] }
dirs = { workspace = true }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
