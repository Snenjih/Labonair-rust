[package]
name = "labonair-background"
version = "0.1.0"
edition = "2021"

[lib]
name = "labonair_background"
path = "src/lib.rs"

[dependencies]
gpui = { workspace = true }
image = { workspace = true }
base64 = "0.22"
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
labonair-filesystem = { path = "../filesystem" }
labonair-theme = { path = "../theme" }
labonair-background-host = { path = "../background-host" }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
