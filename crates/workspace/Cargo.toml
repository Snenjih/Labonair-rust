[package]
name = "labonair-workspace"
version = "0.1.0"
edition = "2021"

[lib]
name = "labonair_workspace"
path = "src/workspace.rs"

[dependencies]
gpui = { workspace = true }
image = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
dirs = { workspace = true }
labonair-theme = { path = "../theme" }
labonair-ui-kit = { path = "../ui-kit" }
labonair-gpui-ext = { path = "../gpui-ext" }
labonair-notifications = { path = "../notifications" }
labonair-command-palette = { path = "../command-palette" }
labonair-panel = { path = "../panel" }
labonair-panel-git-graph = { path = "../panel-git-graph" }
labonair-hosts-ui = { path = "../hosts-ui" }
labonair-terminal = { path = "../terminal" }
labonair-editor = { path = "../editor" }
labonair-backend = { path = "../backend" }
labonair-ai = { path = "../ai" }
labonair-settings = { path = "../settings" }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
