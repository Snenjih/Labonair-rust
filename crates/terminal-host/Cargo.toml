[package]
name = "labonair-terminal-host"
version = "0.1.0"
edition = "2021"

# Detached session host (ADR 0009): wire protocol + daemon library + the
# `labonair-host` binary. Must stay free of GPUI and labonair-theme.
[lib]
name = "labonair_terminal_host"

[[bin]]
name = "labonair-host"
path = "src/bin/labonair-host.rs"

[dependencies]
labonair-terminal-core = { path = "../terminal-core" }
# SSH / SFTP / transfers hosted by the daemon: UI-free contracts (also used by
# the wire types) and the concrete stack wired in `stack.rs`.
labonair-errors = { path = "../errors" }
labonair-events = { path = "../events" }
labonair-persistence = { path = "../persistence" }
labonair-secrets = { path = "../secrets" }
labonair-sftp = { path = "../sftp" }
labonair-sftp-ssh = { path = "../sftp-ssh" }
labonair-ssh = { path = "../ssh" }
labonair-ssh-transport = { path = "../ssh-transport" }
labonair-transfers = { path = "../transfers" }
labonair-transfers-ssh = { path = "../transfers-ssh" }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
libc = { workspace = true }
