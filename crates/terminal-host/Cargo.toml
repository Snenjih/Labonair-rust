[package]
name = "labonair-terminal-host"
version = "0.1.0"
edition = "2021"

# Detached session host (ADR 0009): wire protocol + daemon library + the
# `labonair-host` binary. Must stay free of GPUI and labonair-theme.
[lib]
name = "labonair_terminal_host"

[[bin]]
name = "labonair-host"
path = "src/bin/labonair-host.rs"

[dependencies]
labonair-terminal-core = { path = "../terminal-core" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
libc = { workspace = true }
