[package]
name = "labonair-shell"
version = "0.1.0"
edition = "2021"

[lib]
name = "labonair_shell"
path = "src/shell.rs"

[features]
# Forwards to the ui-kit component gallery (T20-004). The gallery is always
# compiled in debug builds; this only matters for release-build `cargo check
# --features gallery`.
gallery = ["labonair-ui-kit/gallery"]

[dependencies]
gpui = { workspace = true }
gpui-component = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rust-embed = { workspace = true }
tracing = { workspace = true }
dirs = { workspace = true }
tokio = { workspace = true }
labonair-theme = { path = "../theme" }
labonair-ui-kit = { path = "../ui-kit" }
labonair-gpui-ext = { path = "../gpui-ext" }
labonair-notifications = { path = "../notifications" }
labonair-command-palette = { path = "../command-palette" }
labonair-panel = { path = "../panel" }
labonair-workspace = { path = "../workspace" }
labonair-settings-ui = { path = "../settings-ui" }
labonair-panel-explorer = { path = "../panel-explorer" }
labonair-panel-scm = { path = "../panel-scm" }
labonair-panel-git-graph = { path = "../panel-git-graph" }
labonair-panel-snippets = { path = "../panel-snippets" }
labonair-terminal = { path = "../terminal" }
labonair-backend = { path = "../backend" }
# T19-008: the shell owns the concrete `menu::` GPUI Actions, so it is the
# only crate that can actually turn a merged `keymap.json` into real
# `gpui::KeyBinding`s / live fs-watch.
labonair-settings = { path = "../settings" }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
