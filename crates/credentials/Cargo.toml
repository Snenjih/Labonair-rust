[package]
name = "labonair-credentials"
version = "0.1.0"
edition = "2021"

[dependencies]
base64 = "0.22"
labonair-persistence = { path = "../persistence" }
labonair-secrets = { path = "../secrets" }
openssl = { version = "0.10", features = ["vendored"] }
rusqlite = { workspace = true }
serde = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
russh = { version = "0.62.2", default-features = false, features = ["ring", "flate2"] }
