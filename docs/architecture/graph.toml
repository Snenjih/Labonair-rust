# Declarative architecture policy for Labonair.
#
# This file is the machine-readable companion to docs/architecture.md.
# Keep it intentionally explicit: an internal dependency or ownership change
# must update this manifest, the relevant audit, and its implementation task.

version = 1
status = "normative policy source"
source_of_truth = "docs/architecture.md"
generated_view = "docs/generated/architecture.md"

[policy]
composition_roots = ["labonair", "labonair-shell"]
ui_kit = "labonair-ui-kit"
active_queue = "tasks/rework/"
acyclic = true

# Transitional edges are deliberately listed with a removal condition.
# They are not a permission to add new compatibility paths.
[[transitional_edge]]
from = "labonair-command-palette"
to = "labonair-settings"
status = "narrow-when-needed"
removal_condition = "Replace implementation-level settings access when a concrete provider contract exists."

[[transitional_edge]]
from = "labonair-panel-explorer"
to = "labonair-settings"
status = "move-to-feature-contract"
removal_condition = "Move Explorer behavior reads behind an Explorer-owned settings contract."

[[transitional_edge]]
from = "labonair-panel-scm"
to = "labonair-editor"
status = "move-to-feature-contract"
removal_condition = "Replace direct editor view access with a typed editor capability contract."

[[transitional_edge]]
from = "labonair-panel-scm"
to = "labonair-settings"
status = "move-to-feature-contract"
removal_condition = "Replace direct settings implementation reads with an SCM-owned settings contract."

[[transitional_edge]]
from = "labonair-workspace"
to = "labonair-ai"
status = "narrow-when-needed"
removal_condition = "Move AI context and lifecycle details behind a typed AI bridge contract."

[[transitional_edge]]
from = "labonair-workspace"
to = "labonair-settings"
status = "narrow-when-needed"
removal_condition = "Replace implementation-level global access with a narrow capability snapshot when a concrete boundary exists."

[[transitional_edge]]
from = "labonair-command-palette"
to = "labonair-filesystem"
status = "narrow-when-needed"
removal_condition = "Replace direct history storage access only when a second consumer requires a typed provider."


