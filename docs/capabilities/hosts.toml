[capability]
id = "hosts"
display_name = "Hosts"
owner_module = "hosts"
canonical_crate = "labonair-hosts"
sibling_crates = ["labonair-hosts-host", "labonair-hosts-ui"]
public_contract = ["Host", "HostStore", "HostPickerRow", "HostOpenRequest", "HostView"]
canonical_entry_points = [
  "Titlebar global menu -> Hosts workspace tab",
  "Command Palette -> Hosts submenu",
]
alternate_entry_points = ["SSH/SFTP connection commands and recent-host picker rows"]
commands = [
  "OpenHosts",
  "NewSshTab",
  "NewSftpTab",
  "NewQuickSsh",
  "NewSshConnection",
  "ConnectSsh",
  "OpenSftp",
]
default_keymap = ["none declared by Hosts; commands remain discoverable through menu and palette"]
registries = ["HostsCommandProvider", "CommandProvider", "owner-registered palette actions"]
events = ["HostOpenRequest(host_id, mode)", "HostStatus and active-tunnel snapshots through HostView"]
state_owner = "labonair-hosts owns HostStore and labonair-hosts-ui owns HostManagerView presentation state"
persistence_owner = "Hosts-owned SQLite store; credential material remains in labonair-credentials/labonair-secrets"
settings = ["none — Hosts is not a Settings category"]
notifications = ["Connection, migration, and persistence failures publish through the notification registry"]
ui_kit_components = ["ListItem", "button and input primitives", "empty/error states"]
automation_tools = ["MCP host/session integration consumes typed host contracts; no Hosts-local tool registry"]
security_boundaries = [
  "Credential material stays in secrets/credential owners",
  "Host.block_agent_access controls agent use",
  "SSH/SFTP execution remains in transport owners",
  "Jump hosts remain connection configuration, not a second surface",
]
source_files = [
  "crates/hosts/src/lib.rs",
  "crates/hosts/src/store.rs",
  "crates/hosts/src/command_provider.rs",
  "crates/hosts-host/src/lib.rs",
  "crates/hosts-ui/src/hosts.rs",
  "crates/hosts-ui/src/command_provider.rs",
]
tests = [
  "cargo test -p labonair-hosts",
  "cargo test -p labonair-hosts-host",
  "tasks/rework/R04-002-host-management-and-connection-pickers.md",
]
visual_states = [
  "Hosts tab with saved hosts — Pending native capture",
  "empty host list — Pending native capture",
  "host form validation and failure — Pending native capture",
  "command-palette host submenu with SSH/SFTP secondary action — Pending native capture",
]
performance_budget = "No numeric budget is declared; host loads and database work must remain asynchronous and bounded."
current_status = "partial"
target_status = "regression-locked"
known_limitations = [
  "The native visual acceptance matrix is pending in the current Linux environment.",
  "MCP negative-test coverage is tracked outside this pilot descriptor and remains to be cataloged.",
]
removal_condition = "none"
last_verified = "2026-10-09"

[evidence]
contract = ["HostOpenRequest, HostPickerRow, and Host are defined in crates/hosts/src/lib.rs"]
unit = ["Host picker identity and transport intent tests live in crates/hosts/src/lib.rs"]
integration = ["R04-002 records the composed HostManagerView, store, picker, and transport boundaries"]
command = ["HostsCommandProvider owns OpenHosts and connection command descriptors"]
surface = ["Workspace Hosts tab and command-palette host submenu are canonical entry points"]
persistence = ["HostStore is the Hosts-owned SQLite persistence boundary"]
notification = ["R01-009 and R04-002 route passive operation failures to Notifications"]
visual = ["Pending: docs/audits/product-surface-acceptance.md Hosts cells"]
security = ["Host secrets and block_agent_access are explicit contract fields"]
performance = ["N/A: no declared numeric budget; async database and transport rules apply"]
regression = ["tasks/rework/R04-002-host-management-and-connection-pickers.md"]
