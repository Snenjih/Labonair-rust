version = 1

[[workflow]]
id = "application-startup-shutdown"
display_name = "Application startup and shutdown"
owner_module = "application"
canonical_crate = "labonair"
preconditions = ["Native binary is launched with supported platform dependencies."]
entry_point = "Process startup"
state_transitions = ["construct services", "register owner contributions", "open initial window", "flush and release on shutdown"]
commands = ["none"]
persistence = ["Settings, workspace/session, and window state load/save through their owners."]
notifications = ["Startup/service failures use structured diagnostics without blocking the GPUI thread."]
failure_modes = ["Missing database, service initialization failure, window creation failure, interrupted shutdown"]
security_boundary = "Composition root injects contracts; secrets are never logged."
tests = ["crates/app/src/main.rs", "scripts/smoke-test.sh"]
visual_evidence = ["Pending: native first-paint and shutdown capture"]
status = "partial"
next_action = "Record native startup/interactive timing and recovery evidence."
next_task = "tasks/rework/R07-006-documentation-knowledge-system.md"

